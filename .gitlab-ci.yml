include:
  - component: "$CI_SERVER_FQDN/rust-ci/rust-ci/base-pipeline@1.3.0"

stages:
  - .pre
  - lint
  - test
  - coverage
  - docs
  - production
  - release
  - .post

coverage:
  stage: coverage
  image: rust:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cargo install cargo-tarpaulin
    - cargo tarpaulin --out Xml --out Html
    - mkdir -p public
    - cp -r tarpaulin-report.html public/coverage.html
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    paths:
      - cobertura.xml
      - tarpaulin-report.html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "running release_job"
  dependencies:
    - release build
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: './CHANGELOG-LATEST.md'
