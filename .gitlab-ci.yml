include:
  - component: "$CI_SERVER_FQDN/rust-ci/rust-ci/base-pipeline@1.3.0"

stages:
  - .pre
  - lint
  - test
  - coverage
  - docs
  - production
  - .post


coverage:
  stage: coverage
  image: rust:latest
  script:
    - cargo install cargo-tarpaulin
    - cargo tarpaulin --out Xml
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    paths:
      - cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
