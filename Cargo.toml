[package]
name = "protochess"
version = "0.5.0"
edition = "2021"
authors = ["Konnor Klercke <klercke@protonmail.com>"]
description = "A chess game/engine"
license = "AGPL-3.0-only"
repository = "https://gitlab.com/klercke/rschess"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags = "2.9.0"
clap = { version = "4.5.27", features = ["color", "derive"] }
shellish_parse = "2.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unrwap_used = "warn"
